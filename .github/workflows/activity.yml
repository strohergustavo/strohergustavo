name: Contribution graph

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/activity.py", ".github/workflows/activity.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Personal token configured: ${{ secrets.PROFILE_TOKEN != '' }}"
          if python3 scripts/activity.py > "$RUNNER_TEMP/activity.svg"; then
            mv "$RUNNER_TEMP/activity.svg" assets/activity.svg
          else
            echo "::warning::Could not read contributions; kept the previous graph."
          fi
          grep -o 'aria-label="[^"]*"' assets/activity.svg | head -1
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet || git commit -m "Update contribution graph"
          git push
