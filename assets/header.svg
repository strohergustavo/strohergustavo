<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Gustavo Stroher: Product &amp; Solutions Analyst transitioning into Data Engineering &amp; AI">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .in  { opacity: 0; animation: fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .9s }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

  .r1 { animation: r1 8s ease-in-out infinite; }
  .r2 { opacity: 0; animation: r2 8s ease-in-out infinite; }
  @keyframes r1 { 0%,38% { opacity: 1; transform: none } 46%,92% { opacity: 0; transform: translateY(-16px) } 100% { opacity: 1; transform: none } }
  @keyframes r2 { 0%,42% { opacity: 0; transform: translateY(16px) } 52%,86% { opacity: 1; transform: none } 94%,100% { opacity: 0; transform: translateY(-16px) } }

  .bar { animation: bar 8s ease-in-out infinite; transform-origin: 80px 238px; }
  @keyframes bar { 0%,40% { transform: scaleX(.18) } 52%,88% { transform: scaleX(1) } 100% { transform: scaleX(.18) } }

  .flow { stroke-dasharray: 4 16; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -40 } }

  .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 3s ease-out infinite; }
  @keyframes ring { 0% { opacity: .9; transform: scale(1) } 70%,100% { opacity: 0; transform: scale(2.6) } }

  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25 } }
</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1C1C1C"/></pattern>
  <radialGradient id="glow" cx="88%" cy="0%" r="60%"><stop offset="0" stop-color="#D97757" stop-opacity=".22"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1200" height="400" rx="18" fill="#0D0D0D"/>
<rect width="1200" height="400" rx="18" fill="url(#grid)"/>
<rect width="1200" height="400" rx="18" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="399" rx="18" fill="none" stroke="#222"/>

<g class="in d1">
  <text x="80" y="78" class="mono" font-size="17" fill="#737373">~/gustavo-stroher</text>
  <rect x="936" y="54" width="184" height="34" rx="17" fill="#141414" stroke="#2A2A2A"/>
  <circle cx="958" cy="71" r="5" fill="#D97757" class="dot"/>
  <text x="972" y="76.5" class="mono" font-size="15" fill="#A3A3A3">in transition</text>
</g>

<g class="in d2">
  <text x="78" y="168" class="sans" font-size="66" font-weight="700" fill="#F5F5F5" letter-spacing="-1.5">Gustavo Stroher</text>
</g>

<g class="in d3">
  <rect x="80" y="236" width="320" height="3" rx="1.5" fill="#222"/>
  <rect x="80" y="236" width="320" height="3" rx="1.5" fill="#D97757" class="bar"/>
  <g class="r1"><text x="80" y="218" class="sans" font-size="28" fill="#A3A3A3">Product &amp; Solutions Analyst</text></g>
  <g class="r2"><text x="80" y="218" class="sans" font-size="28" font-weight="600" fill="#D97757">Data Engineering &amp; AI</text></g>
</g>

<g class="in d4">
  <line x1="160" y1="318" x2="1040" y2="318" stroke="#262626" stroke-width="2"/>
  <line x1="160" y1="318" x2="1040" y2="318" stroke="#D97757" stroke-width="2" class="flow"/>

  <circle cx="160" cy="318" r="8" fill="none" stroke="#8A6A58" stroke-width="1.5" class="ring" style="animation-delay:0s"/>
  <circle cx="160" cy="318" r="8" fill="#0D0D0D" stroke="#8A6A58" stroke-width="2"/>
  <circle cx="160" cy="318" r="3" fill="#8A6A58"/>
  <text x="160" y="358" text-anchor="middle" class="mono" font-size="15" fill="#8A8A8A"><tspan fill="#8A6A58">bronze</tspan> · raw</text>
  <circle cx="600" cy="318" r="8" fill="none" stroke="#C9C9C9" stroke-width="1.5" class="ring" style="animation-delay:1s"/>
  <circle cx="600" cy="318" r="8" fill="#0D0D0D" stroke="#C9C9C9" stroke-width="2"/>
  <circle cx="600" cy="318" r="3" fill="#C9C9C9"/>
  <text x="600" y="358" text-anchor="middle" class="mono" font-size="15" fill="#8A8A8A"><tspan fill="#C9C9C9">silver</tspan> · refined</text>
  <circle cx="1040" cy="318" r="8" fill="none" stroke="#D97757" stroke-width="1.5" class="ring" style="animation-delay:2s"/>
  <circle cx="1040" cy="318" r="8" fill="#0D0D0D" stroke="#D97757" stroke-width="2"/>
  <circle cx="1040" cy="318" r="3" fill="#D97757"/>
  <text x="1040" y="358" text-anchor="middle" class="mono" font-size="15" fill="#8A8A8A"><tspan fill="#D97757">gold</tspan> · insight</text>
</g>
</svg>
