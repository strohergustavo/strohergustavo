<svg xmlns="http://www.w3.org/2000/svg" width="420" height="132" viewBox="0 0 420 132" role="img" aria-label="ANAC Flight Analytics Platform: End-to-end Lakehouse on Databricks with Brazil's public aviation data, from raw files to a gold layer for BI and AI. Python 100%.">
<style>
